name: Player Market Refresh

# MLB HR odds are fetched once daily at 2:15 PM America/Denver (20:15 UTC in MDT,
# 21:15 UTC in MST) to conserve The Odds API Starter plan credits (500/month).
# This timing allows the afternoon run to satisfy the 2:00 PM MT eligibility gate
# on the live board while still capturing lines before late games.
# The workflow can still be triggered manually via workflow_dispatch for ad-hoc runs.

on:
  schedule:
    - cron: "15 20 * * *"  # 2:15 PM MDT (20:15 UTC) / 2:15 PM MST (21:15 UTC)
  workflow_dispatch:
    inputs:
      date:
        description: "Denver slate date in YYYY-MM-DD (defaults to America/Denver today)"
        required: false
        default: ""
      run_pga:
        description: "Run PGA tournament refresh through the registry orchestrator"
        required: false
        default: "false"
      run_mlb_hr:
        description: "Run MLB home run refresh"
        required: false
        default: "true"
      train_mlb_hr:
        description: "Retrain MLB home run model before scoring"
        required: false
        default: "false"
      sync_supabase:
        description: "Sync generated player markets to Supabase"
        required: false
        default: "true"
      sync_bigquery:
        description: "Sync generated player markets to BigQuery"
        required: false
        default: "true"
      run_window:
        description: "Board window: auto, morning, afternoon, or manual"
        required: false
        default: "auto"
      apply_trusted_board_migration:
        description: "Apply the versioned trusted-board migration (staging/rollout only)"
        required: false
        default: "false"

concurrency:
  group: sports-edge-mlb-hr-refresh
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  PYTHONPATH: ${{ github.workspace }}/data-core
  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
  RUN_PGA: ${{ github.event.inputs.run_pga || 'false' }}
  RUN_MLB_HR: ${{ github.event.inputs.run_mlb_hr || 'true' }}
  TRAIN_MLB_HR: ${{ github.event.inputs.train_mlb_hr || 'false' }}
  SYNC_SUPABASE: ${{ github.event.inputs.sync_supabase || 'true' }}
  SYNC_BIGQUERY: ${{ github.event.inputs.sync_bigquery || 'true' }}
  RUN_WINDOW: ${{ github.event.inputs.run_window || 'auto' }}
  APPLY_TRUSTED_BOARD_MIGRATION: ${{ github.event.inputs.apply_trusted_board_migration || 'false' }}
  ANCHOR_DATE: ${{ github.event.inputs.date || '' }}
  MLB_HR_STATCAST_MIN_COVERAGE: ${{ vars.MLB_HR_STATCAST_MIN_COVERAGE || '0.50' }}
  MLB_HR_STATCAST_MIN_BATTER_BBE: ${{ vars.MLB_HR_STATCAST_MIN_BATTER_BBE || '5' }}
  MLB_HR_STATCAST_MIN_PITCHER_BBE: ${{ vars.MLB_HR_STATCAST_MIN_PITCHER_BBE || '5' }}
  MLB_HR_STATCAST_LOOKBACK_DAYS: ${{ vars.MLB_HR_STATCAST_LOOKBACK_DAYS || '120' }}
  MLB_HR_STATCAST_REFRESH_DAYS: ${{ vars.MLB_HR_STATCAST_REFRESH_DAYS || '10' }}
  MLB_HR_STATCAST_DEADLINE_SECONDS: ${{ vars.MLB_HR_STATCAST_DEADLINE_SECONDS || '360' }}
  MLB_HR_ALLOW_PARTIAL_STATCAST: ${{ vars.MLB_HR_ALLOW_PARTIAL_STATCAST || 'false' }}
  MLB_HR_STRICT_STATCAST_HEALTH: ${{ vars.MLB_HR_STRICT_STATCAST_HEALTH || 'false' }}

jobs:
  refresh:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data-core
    env:
      GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/gcp-key.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: data-core/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt google-cloud-bigquery supabase

      - name: Configure GCP credentials
        if: ${{ env.SYNC_BIGQUERY == 'true' }}
        shell: bash
        run: |
          echo "$GCP_SERVICE_ACCOUNT_KEY" > "$GOOGLE_APPLICATION_CREDENTIALS"
        env:
          GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Resolve Denver slate date and board window
        id: dates
        shell: bash
        run: |
          if [ -n "$ANCHOR_DATE" ]; then
            DATE_VALUE="$ANCHOR_DATE"
          else
            DATE_VALUE="$(TZ=America/Denver date +%Y-%m-%d)"
          fi
          if [ "$RUN_WINDOW" = "auto" ]; then
            HOUR="$(TZ=America/Denver date +%H)"
            if [ "$HOUR" -lt 12 ]; then WINDOW_VALUE="morning"; else WINDOW_VALUE="afternoon"; fi
          else
            WINDOW_VALUE="$RUN_WINDOW"
          fi
          echo "date=$DATE_VALUE" >> "$GITHUB_OUTPUT"
          echo "window=$WINDOW_VALUE" >> "$GITHUB_OUTPUT"

      - name: Prepare player-market serving schema
        if: ${{ env.RUN_MLB_HR == 'true' && env.SYNC_SUPABASE == 'true' }}
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          supabaseDBpass: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
        run: python scripts/apply_supabase_sql_files.py sql/015_player_market_serving_tables.sql sql/016_mlb_hr_recency_columns.sql sql/017_player_market_health_results.sql

      - name: Prepare trusted-board migration for this run
        if: ${{ env.RUN_MLB_HR == 'true' && env.SYNC_SUPABASE == 'true' && env.APPLY_TRUSTED_BOARD_MIGRATION == 'true' }}
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          supabaseDBpass: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
        run: python scripts/apply_supabase_sql_files.py supabase/migrations/20260811144616_mlb_hr_trusted_board.sql

      - name: Apply trusted-board empty-overwrite guard
        if: ${{ env.RUN_MLB_HR == 'true' && env.SYNC_SUPABASE == 'true' }}
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          supabaseDBpass: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
        run: python scripts/apply_supabase_sql_files.py supabase/migrations/20260830120000_guard_mlb_hr_empty_overwrite.sql

      - name: Start immutable MLB HR board run
        id: board_run
        if: ${{ env.RUN_MLB_HR == 'true' && env.SYNC_SUPABASE == 'true' }}
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          supabaseDBpass: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
        run: |
          RUN_KEY="mlb-hr-${{ steps.dates.outputs.date }}-${{ steps.dates.outputs.window }}-${GITHUB_RUN_ID}"
          python scripts/manage_mlb_hr_board_run.py start \
            --run-key "$RUN_KEY" \
            --slate-date "${{ steps.dates.outputs.date }}" \
            --run-window "${{ steps.dates.outputs.window }}" \
            --workflow-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "run_key=$RUN_KEY" >> "$GITHUB_OUTPUT"

      - name: Generate PGA tournament dashboard
        if: ${{ env.RUN_PGA == 'true' }}
        shell: bash
        run: |
          python scripts/refresh_pga_tournament.py --skip-results-fetch --live-odds

      - name: Retrain MLB home run model
        if: ${{ env.RUN_MLB_HR == 'true' && env.TRAIN_MLB_HR == 'true' }}
        shell: bash
        run: |
          python scripts/train_mlb_home_run_model.py \
            --start-date 2025-03-01 \
            --end-date "${{ steps.dates.outputs.date }}" \
            --test-start-date 2026-03-01

      - name: Refresh Statcast cache for MLB HR blend
        if: ${{ env.RUN_MLB_HR == 'true' }}
        shell: bash
        run: |
          python - <<'PY'
          from datetime import date, timedelta
          from pathlib import Path
          import pandas as pd
          from src.models.mlb_hr_statcast_features import DEFAULT_STATCAST_CACHE, preload_statcast_cache

          anchor = date.fromisoformat("${{ steps.dates.outputs.date }}")
          try:
              frame = preload_statcast_cache(
                  anchor,
                  lookback_days=int("${{ env.MLB_HR_STATCAST_LOOKBACK_DAYS }}"),
                  refresh_days=int("${{ env.MLB_HR_STATCAST_REFRESH_DAYS }}"),
                  cache=Path(DEFAULT_STATCAST_CACHE),
                  timeout=30,
                  deadline_seconds=float("${{ env.MLB_HR_STATCAST_DEADLINE_SECONDS }}"),
              )
          except Exception as exc:  # noqa: BLE001
              print(f"WARNING: Statcast preload failed; MLB HR generation will continue with fallback scoring if needed: {exc}")
          else:
              latest = pd.to_datetime(frame.get("game_date", pd.Series(dtype=object)), errors="coerce").max()
              latest_text = latest.date() if pd.notna(latest) else "n/a"
              print(f"Statcast cache ready at {DEFAULT_STATCAST_CACHE}; rows={len(frame)} latest={latest_text}")
          PY

      - name: Generate MLB home run probabilities
        if: ${{ env.RUN_MLB_HR == 'true' }}
        shell: bash
        run: |
          python scripts/predict_mlb_home_runs.py \
            --date "${{ steps.dates.outputs.date }}" \
            --history-days 45 \
            --statcast-min-batter-bbe "$MLB_HR_STATCAST_MIN_BATTER_BBE" \
            --statcast-min-pitcher-bbe "$MLB_HR_STATCAST_MIN_PITCHER_BBE" \
            --statcast-deadline-seconds "$MLB_HR_STATCAST_DEADLINE_SECONDS" \
            --top-n 120
          HEALTH_ARGS=(--min-coverage "$MLB_HR_STATCAST_MIN_COVERAGE")
          if [ "$MLB_HR_STRICT_STATCAST_HEALTH" != "true" ]; then
            HEALTH_ARGS+=(--warn-only)
          fi
          python scripts/validate_mlb_hr_statcast_health.py \
            "${HEALTH_ARGS[@]}" \
            ../web/public/data/mlb_home_runs.json

      - name: Apply player market serving schema
        if: ${{ env.RUN_MLB_HR == 'true' && env.SYNC_SUPABASE == 'true' }}
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          supabaseDBpass: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
        run: python scripts/apply_supabase_sql_files.py sql/015_player_market_serving_tables.sql sql/016_mlb_hr_recency_columns.sql sql/017_player_market_health_results.sql

      - name: Fetch MLB home run odds
        if: ${{ env.RUN_MLB_HR == 'true' }}
        shell: bash
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          supabaseDBpass: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
        run: |
          # PropLine fallback: if ODDS_API_KEY is missing, quota-exhausted (401/429), or
          # returns 0 priced rows, the script falls back to PROPLINE_API_KEY if set.
          # To enable PropLine, add GitHub secret PROPLINE_API_KEY (get free key at https://prop-line.com).
          if [ "$SYNC_SUPABASE" = "true" ]; then
            python scripts/fetch_mlb_home_run_odds.py \
              --date "${{ steps.dates.outputs.date }}" \
              --sync-supabase
          else
            python scripts/fetch_mlb_home_run_odds.py \
              --date "${{ steps.dates.outputs.date }}"
          fi

      - name: Export combined prediction feed
        shell: bash
        run: |
          FEED_ARGS=()
          if [ "$RUN_PGA" != "true" ]; then
            FEED_ARGS+=(--skip-pga)
          fi
          if [ "$RUN_MLB_HR" != "true" ]; then
            FEED_ARGS+=(--skip-mlb)
          fi
          python scripts/export_prediction_feed.py "${FEED_ARGS[@]}"

      - name: Validate public JSON
        shell: bash
        run: |
          if [ "$RUN_MLB_HR" = "true" ]; then
            python scripts/validate_public_json.py --mlb-hr-date "${{ steps.dates.outputs.date }}"
          else
            python scripts/validate_public_json.py
          fi
          if [ "$RUN_MLB_HR" = "true" ]; then
            python scripts/validate_mlb_hr_board_input.py \
              ../web/public/data/mlb_home_runs.json \
              --date "${{ steps.dates.outputs.date }}" \
              --allow-empty
          fi

      - name: Sync player markets to BigQuery
        if: ${{ env.SYNC_BIGQUERY == 'true' }}
        shell: bash
        run: |
          SYNC_ARGS=(--project "$PROJECT_ID")
          if [ "$RUN_PGA" != "true" ]; then
            SYNC_ARGS+=(--skip-pga)
          fi
          python scripts/sync_player_markets_to_bigquery.py "${SYNC_ARGS[@]}"

      - name: Sync player markets to Supabase
        id: sync_player_markets
        if: ${{ env.SYNC_SUPABASE == 'true' }}
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          supabaseDBpass: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
        run: |
          python scripts/apply_supabase_sql_files.py sql/015_player_market_serving_tables.sql sql/016_mlb_hr_recency_columns.sql sql/017_player_market_health_results.sql
          SYNC_ARGS=()
          if [ "$RUN_PGA" != "true" ]; then
            SYNC_ARGS+=(--skip-pga)
          fi
          python scripts/sync_player_markets_to_supabase.py "${SYNC_ARGS[@]}"

      - name: Grade completed prior-slate MLB HR rows
        id: grade_prior
        if: ${{ env.RUN_MLB_HR == 'true' && env.SYNC_SUPABASE == 'true' }}
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          supabaseDBpass: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
        run: |
          EVAL_DATE="$(date -d '${{ steps.dates.outputs.date }} -1 day' +%Y-%m-%d)"
          python scripts/evaluate_mlb_home_run_predictions.py \
            --from-supabase \
            --date "$EVAL_DATE" \
            --allow-empty \
            --out-csv notebooks/cache/mlb_home_run_predictions_evaluated.csv \
            --metrics-out notebooks/cache/mlb_home_run_prediction_outcome_metrics.json
          if [ -s notebooks/cache/mlb_home_run_predictions_evaluated.csv ]; then
            python scripts/sync_mlb_home_run_results_to_supabase.py \
              --evaluated-csv notebooks/cache/mlb_home_run_predictions_evaluated.csv
          fi

      - name: Publish immutable MLB HR board rows
        id: publish_board
        if: ${{ always() && steps.board_run.outcome == 'success' && steps.sync_player_markets.outcome == 'success' && steps.grade_prior.outcome == 'success' }}
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          supabaseDBpass: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
        run: |
          python scripts/manage_mlb_hr_board_run.py publish \
            --run-key "${{ steps.board_run.outputs.run_key }}" \
            --slate-date "${{ steps.dates.outputs.date }}"

      - name: Finalize MLB HR board health
        if: ${{ always() && steps.board_run.outcome == 'success' }}
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          supabaseDBpass: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
        run: |
          STATUS_ARGS=()
          if [ "${{ steps.publish_board.outcome }}" != "success" ]; then
            STATUS_ARGS+=(--status failed)
          fi
          python scripts/manage_mlb_hr_board_run.py finalize \
            --run-key "${{ steps.board_run.outputs.run_key }}" \
            "${STATUS_ARGS[@]}" | tee /tmp/mlb_hr_board_finalize.json

      - name: Publish trusted-board run summary
        if: ${{ always() && steps.board_run.outcome == 'success' }}
        shell: bash
        run: |
          echo "### Trusted MLB HR board run" >> "$GITHUB_STEP_SUMMARY"
          if [ -s /tmp/mlb_hr_board_finalize.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/mlb_hr_board_finalize.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -z "$DISCORD_WEBHOOK_URL" ] || [ ! -s /tmp/mlb_hr_board_finalize.json ]; then
            echo "DISCORD_WEBHOOK_URL is not configured or no board summary was produced; skipping notification."
            exit 0
          fi
          STATUS=$(tail -n 1 /tmp/mlb_hr_board_finalize.json | jq -r '.status // "unknown"')
          COVERAGE=$(tail -n 1 /tmp/mlb_hr_board_finalize.json | jq -r '.top25_coverage // "n/a"')
          curl -sf -X POST -H "Content-Type: application/json" \
            -d "{\"content\":\"MLB HR board ${GITHUB_WORKFLOW} ${GITHUB_RUN_ID}: ${STATUS}, top-25 coverage ${COVERAGE}.\"}" \
            "$DISCORD_WEBHOOK_URL"
