  subject_type: team
  target_type: continuous
  sides: [over, under]
  result_source: mlb_stats_api
  model_name: mlb_totals_model
  model_version: v1
  live_enabled: false
  backtest_enabled: true
  min_books: 2
  max_price_age_minutes: 20
  status: "Research v1 complete; needs forecast weather timing and historical totals prices"

- sport: MLB
  provider_sport_key: baseball_mlb
  market_id: batter_home_runs
  provider_market_key: batter_home_runs
  subject_type: player
  target_type: count
  sides: [over, under]
  result_source: mlb_stats_api
  model_name: mlb_batter_home_runs
