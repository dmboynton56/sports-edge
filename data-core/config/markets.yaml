# Canonical Market Registry for Sports Edge
# 
# This registry defines all sports betting markets that Sports Edge can model,
# serve, or evaluate. Each entry drives ingestion, model dispatch, grading,
# serving, and the web market registry.
#
# Fields:
#   sport: Sport identifier (MLB, NBA, NFL, PGA, etc.)
#   provider_sport_key: The Odds API sport key
#   market_id: Canonical internal market identifier
#   provider_market_key: The Odds API market key
#   subject_type: team | player | field
#   target_type: binary | count | continuous | placement
#   sides: List of outcome sides (e.g., [over, under])
#   result_source: Where game/player results come from
#   model_name: Model identifier if one exists
#   model_version: Model version (v1, v2, etc.) if applicable
#   live_enabled: Whether this market is served live on the website
#   backtest_enabled: Whether historical backtesting is enabled
#   min_books: Minimum number of books required for a valid market
#   max_price_age_minutes: Maximum age of odds before considered stale
#   status: Current status note

# ============================================================================
# MLB Markets (in season, primary)
# ============================================================================

- sport: MLB
  provider_sport_key: baseball_mlb
  market_id: moneyline
  provider_market_key: h2h
  subject_type: team
  target_type: binary
  sides: [home, away]
  result_source: mlb_stats_api
  model_name: mlb_winner_model
  model_version: v3
  live_enabled: true
  backtest_enabled: true
  min_books: 2
  max_price_age_minutes: 20
  status: "Live with v3; v4 research showed negative results vs v1"

- sport: MLB
  provider_sport_key: baseball_mlb
  market_id: run_line
  provider_market_key: spreads
  subject_type: team
  target_type: binary
  sides: [home, away]
  result_source: mlb_stats_api
  model_name: mlb_runline_model
  model_version: v1
  live_enabled: false
  backtest_enabled: true
  min_books: 2
  max_price_age_minutes: 20
  status: "Research v1 complete; awaiting historical spread prices and evaluation"

- sport: MLB
  provider_sport_key: baseball_mlb
